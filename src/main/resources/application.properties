# --- Datadog / Micrometer (Spring Boot 3.x usa el prefijo management.datadog.metrics.export.*) ---
# Las credenciales NO van hardcodeadas: se toman de variables de entorno (Render -> Environment).
# Para activar el envío a Datadog basta con setear estas 3 vars, sin tocar código ni redeployar:
#   DATADOG_ENABLED=true
#   DATADOG_API_KEY=<api key de la cuenta>
#   DATADOG_APP_KEY=<application key de la cuenta>
# Con DATADOG_ENABLED=false (default) la app arranca igual y las métricas siguen disponibles
# en /actuator/metrics, solo que no se exportan.
management.datadog.metrics.export.enabled=${DATADOG_ENABLED:false}
management.datadog.metrics.export.api-key=${DATADOG_API_KEY:}
management.datadog.metrics.export.application-key=${DATADOG_APP_KEY:}
management.datadog.metrics.export.step=1m
management.datadog.metrics.export.uri=${DATADOG_URI:https://api.datadoghq.com}
management.metrics.tags.modulo=Incentivos
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

 
spring.devtools.restart.enabled=true


server.port=${PORT:8080}